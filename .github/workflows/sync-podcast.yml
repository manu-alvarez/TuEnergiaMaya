name: Sync Podcast Episodes

on:
  schedule:
    - cron: '0 0 * * *' # Every day at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Install dependencies
        run: |
          cd frontend
          npm install
          
      - name: Run sync script
        run: |
          cd frontend
          node scripts/sync-episodes.js
          
      - name: Commit and push changes
        run: |
          git config --global user.name 'Podcast Sync Bot'
          git config --global user.email 'bot@tuenergiamaya.com'
          git add frontend/src/data/episodes.js
          git diff --quiet \u0026\u0026 git diff --staged --quiet || (git commit -m "chore: sync podcast episodes" \u0026\u0026 git push)
